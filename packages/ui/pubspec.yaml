name: ui
description: "fm music player UI module"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  file_picker: ^10.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  card_settings_ui: ^2.0.1
  core:
    path: ../core
  crawler:
    path: ../crawler
  player:
    path: ../player
  db:
    path: ../db

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.8

# audiotags 锁 freezed_annotation ^2.4.1 与 riverpod_generator ≥4.0.7（需 ^3）冲突，
# 经用户确认覆写为 ^3：audiotags 生成代码为包内预生成，不兼容会在编译期暴露。
dependency_overrides:
  freezed_annotation: ^3.0.0

flutter:
