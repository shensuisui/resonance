# 临时工作流：仅用于重新生成 fm_app/pubspec.lock 供提交，用完即删。
name: Tmp lock dump

on:
  push:
    branches: [agent/add-build-workflow-2a47a2c0c9ea]

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: fm_app
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lock
          path: fm_app/pubspec.lock
          retention-days: 1